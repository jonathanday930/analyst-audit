<!doctype html>
<html>
<head>

<title>AnalystAudit — Clickable Prototype</title>

<style>

    --accent: #e3a63a; --accent-soft: rgba(227,166,58,0.14);
    --good: #4fbf7a; --good-soft: rgba(79,191,122,0.14);
    --bad: #e0616b; --bad-soft: rgba(224,97,107,0.14);
    --pending: #8b96a3; --pending-soft: rgba(139,150,163,0.12);
  }
  .gl-root, .gl-root button, .gl-root input { font-family: 'Space Grotesk', system-ui, sans-serif; }
  .gl-mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .gl-root a { color: var(--accent); text-decoration: none; }
  .gl-root a:hover { color: #f0bb5e; }
  .gl-root button { cursor: pointer; }
  .gl-root ::-webkit-scrollbar { width: 10px; height: 10px; }
  .gl-root ::-webkit-scrollbar-track { background: var(--bg); }
  .gl-root ::-webkit-scrollbar-thumb { background: #2a323d; border-radius: 6px; }
  .gl-card:hover { background: var(--card-hover) !important; border-color: #3a4451 !important; }
  .gl-navitem:hover { background: var(--card) !important; }
  .gl-claimrow:hover { background: var(--card-hover) !important; }
</style>
</head>
<body>
<div id="app" class="gl-root" style="display:flex;width:100%;min-height:100vh;background:var(--bg);color:var(--text);"></div>

function setState(patch) { Object.assign(state, patch); render(); }

    { id: 'c9', guruId: 'value-vane', asset: 'Regional homebuilders', ticker: 'XHB', condition: 'None — unconditional', conditionType: 'UNCONDITIONAL', outcome: '20% upside as rates ease', horizon: 'swing', timeframeText: '"next 4-5 months"', windowText: 'Aug 20 – Jan 20, 2027', status: 'open', verdict: null, rationale: null, sourceTitle: 'Rate Cuts and Housing', sourceType: 'blog', sourceUrl: 'https://exampleblog.com/rate-cuts-and-housing', claimDate: 'Aug 20, 2026', guruName: 'ValueVane' },
    { id: 'c10', guruId: 'oilpatch-ollie', asset: 'Crude Oil', ticker: 'CL=F', condition: 'None — unconditional', conditionType: 'UNCONDITIONAL', outcome: 'Breaks $100 on supply crunch', horizon: 'swing', timeframeText: '"by year-end"', windowText: 'Jun 1 – Dec 31, 2026', status: 'resolved', verdict: 'bad', rationale: 'Oil peaked at $84 in the window and never approached $100 — the supply crunch thesis did not play out.', evaluatedDate: 'Jan 1, 2027', tradeReturnValue: 7.7, tradeReturnLabel: '+7.7%', benchmarks: [{ label: 'S&P 500', ticker: 'SPY', value: 11.2, display: '+11.2%' }, { label: 'Nasdaq', ticker: 'QQQ', value: 13.5, display: '+13.5%' }], sourceTitle: 'Why $100 Oil Is Coming', sourceType: 'video', sourceUrl: 'https://youtube.com/watch?v=oil100-demo', claimDate: 'Jun 1, 2026', guruName: 'OilPatch Ollie' },
    { id: 'c11', guruId: 'oilpatch-ollie', asset: 'Natural Gas', ticker: 'NG=F', condition: 'If winter demand spikes', conditionType: 'EVENT TRIGGER', outcome: 'Prices double', horizon: 'short', timeframeText: '"within the cold snap"', windowText: 'Trigger not yet met', status: 'open', verdict: null, rationale: null, sourceTitle: 'Winter Setup', sourceType: 'video', sourceUrl: 'https://youtube.com/watch?v=wintersetup-demo', claimDate: 'Aug 25, 2026', guruName: 'OilPatch Ollie' },
    { id: 'c12', guruId: 'swing-sensei', asset: 'Semiconductors', ticker: 'SMH', condition: 'None — unconditional', conditionType: 'UNCONDITIONAL', outcome: 'Next leg up on AI capex', horizon: 'swing', timeframeText: '"next couple months"', windowText: 'Jul 1 – Sep 15, 2026', status: 'resolved', verdict: 'good', rationale: 'SMH rose from $238 to $271 (+13.9%) over the window — the call paid off.', evaluatedDate: 'Sep 16, 2026', tradeReturnValue: 13.9, tradeReturnLabel: '+13.9%', benchmarks: [{ label: 'S&P 500', ticker: 'SPY', value: 4.8, display: '+4.8%' }, { label: 'Nasdaq', ticker: 'QQQ', value: 6.1, display: '+6.1%' }], sourceTitle: 'AI Capex Isn’t Slowing', sourceType: 'blog', sourceUrl: 'https://exampleblog.com/ai-capex-isnt-slowing', claimDate: 'Jul 1, 2026', guruName: 'SwingSensei' },
    { id: 'c13', guruId: 'swing-sensei', asset: 'Regional Banks', ticker: 'KRE', condition: 'If credit conditions worsen', conditionType: 'EVENT TRIGGER', outcome: 'Another leg down', horizon: 'short', timeframeText: '"in the following weeks"', windowText: 'Trigger not yet met', status: 'open', verdict: null, rationale: null, sourceTitle: 'Credit Cracks', sourceType: 'blog', sourceUrl: 'https://exampleblog.com/credit-cracks', claimDate: 'Aug 18, 2026', guruName: 'SwingSensei' },
  ];
}

function getDraftClaims() {
  return [
    { id: 'd1', asset: 'Nvidia', condition: 'None — unconditional. "next 6-8 weeks", targeting Sep 20 – Nov 8, 2026', outcome: 'Continues higher into earnings', horizon: 'swing' },
    { id: 'd2', asset: 'US Dollar Index', condition: 'If the Fed signals a pause. Event-triggered, no fixed window', outcome: 'Weakens further, below 100', horizon: 'short' },
    { id: 'd3', asset: 'Homebuilders', condition: 'None — unconditional. "long-term", no fixed date given', outcome: 'Bullish as rate cuts continue', horizon: 'long' },
  ];
}

// ---------- style helpers ----------
function activeChip(active) {
  return active
    ? 'padding:8px 14px;border-radius:7px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);font-size:12.5px;font-weight:600;'
    : 'padding:8px 14px;border-radius:7px;border:1px solid var(--border);background:none;color:var(--text-muted);font-size:12.5px;';
}
function navItemStyle(active) {
  return active
    ? 'display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:7px;background:var(--card);border:none;color:var(--text);font-size:13.5px;text-align:left;'
    : 'display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:7px;background:none;border:none;color:var(--text-muted);font-size:13.5px;text-align:left;';
}
function horizonStyle(h) {
  if (h === 'short') return { label: 'SHORT-TERM', bg: 'var(--pending-soft)', color: 'var(--text-faint)' };
  if (h === 'long') return { label: 'LONG-TERM', bg: 'var(--accent-soft)', color: 'var(--accent)' };
  return { label: 'SWING', bg: 'var(--accent-soft)', color: 'var(--accent)' };
}
function statusStyle(claim) {
  if (claim.status === 'open') return { label: 'OPEN', color: 'var(--pending)', bg: 'var(--pending-soft)' };
  if (claim.verdict === 'good') return { label: 'GOOD CALL', color: 'var(--good)', bg: 'var(--good-soft)' };
  return { label: 'BAD CALL', color: 'var(--bad)', bg: 'var(--bad-soft)' };
}
function scoreColor(score) {
  if (score >= 70) return 'var(--good)';
  if (score >= 50) return 'var(--accent)';
  return 'var(--bad)';
}
function escapeHtml(str) {
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function escapeAttr(str) {
  return escapeHtml(str).replace(/"/g, '&quot;');
}

// ---------- detection logic (auto "Add a link" flow) ----------
function detectSourceType(url) {
  const u = url.toLowerCase();
  return (u.indexOf('youtube.com') !== -1 || u.indexOf('youtu.be') !== -1) ? 'video' : 'blog';
}
function detectExpert(url, experts) {
  const u = url.toLowerCase().replace(/[^a-z0-9]/g, '');
  return experts.find((g) => {
    const slug = g.id.replace(/-/g, '');
    const nameSlug = g.name.toLowerCase().replace(/[^a-z0-9]/g, '');
    return u.indexOf(slug) !== -1 || u.indexOf(nameSlug) !== -1;
  }) || null;
}
function runDetection() {
  const gurusRaw = getGurus();
  const sourceType = detectSourceType(state.addUrl);
  const match = detectExpert(state.addUrl, gurusRaw);
  setState({
    addPhase: 'detect', addSourceType: sourceType,
    addDetectedGuruId: match ? match.id : null,
    addTarget: match ? 'existing' : 'new',
    addGuruId: match ? match.id : null,
  });
}

// ---------- navigation / actions ----------
function goWatchlist() { setState({ screen: 'watchlist', listScreen: 'watchlist' }); }
function goBrowse() { setState({ screen: 'browse', listScreen: 'browse' }); }
function goAddLink() {
  setState({
    screen: 'add', addMode: 'auto', addPhase: 'link', addTarget: null, addGuruId: null,
    addDetectedGuruId: null, addName: '', addSourceType: 'video', addUrl: '', addSelected: {},
  });
}
function goAddToGuru(guruId) {
  setState({
    screen: 'add', addMode: 'direct', addPhase: 'details', addTarget: 'existing', addGuruId: guruId,
    addName: '', addSourceType: 'video', addUrl: '', addSelected: {},
  });
}
function toggleFollow(id) {
  const next = { ...state.followed };
  next[id] = !next[id];
  setState({ followed: next });
}
function toggleDraft(id) {
  const current = state.addSelected[id] !== false;
  const next = { ...state.addSelected };
  next[id] = !current;
  setState({ addSelected: next });
}
function confirmSave() {
  const vals = computeVals();
  setState({ addPhase: 'done', addSavedCount: vals.selectedDraftCount });
}
function doneBack() {
  if (state.addTarget === 'existing') setState({ screen: 'profile', selectedGuruId: state.addGuruId });
  else goWatchlist();
}
function doneAgain() {
  if (state.addTarget === 'existing') goAddToGuru(state.addGuruId);
  else goAddLink();
}

function handleAction(act, id) {
  switch (act) {
    case 'goWatchlist': goWatchlist(); break;
    case 'goBrowse': goBrowse(); break;
    case 'goAddLink': goAddLink(); break;
    case 'selectGuru': setState({ screen: 'profile', selectedGuruId: id, claimFilter: 'all' }); break;
    case 'toggleFollow': toggleFollow(id); break;
    case 'backToList': setState({ screen: state.listScreen }); break;
    case 'addToGuru': goAddToGuru(id); break;
    case 'filterAll': setState({ claimFilter: 'all' }); break;
    case 'filterOpen': setState({ claimFilter: 'open' }); break;
    case 'filterResolved': setState({ claimFilter: 'resolved' }); break;
    case 'selectClaim': setState({ screen: 'claim', selectedClaimId: id }); break;
    case 'backFromClaim': {
      const claimsRaw = getClaims();
      const c = claimsRaw.find((x) => x.id === state.selectedClaimId) || claimsRaw[0];
      setState({ screen: 'profile', selectedGuruId: c.guruId });
      break;
    }
    case 'backFromLink': setState({ screen: state.listScreen }); break;
    case 'runDetection': runDetection(); break;
    case 'useDifferentExpert': setState({ addTarget: 'new', addGuruId: null, addDetectedGuruId: null }); break;
    case 'backToLink': setState({ addPhase: 'link' }); break;
    case 'continueFromDetect': setState({ addPhase: 'processing' }); break;
    case 'setSourceVideo': setState({ addSourceType: 'video' }); break;
    case 'setSourceBlog': setState({ addSourceType: 'blog' }); break;
    case 'backFromDetails': setState({ screen: 'profile', selectedGuruId: state.addGuruId }); break;
    case 'continueToProcessing': setState({ addPhase: 'processing' }); break;
    case 'continueToReview': setState({ addPhase: 'review' }); break;
    case 'toggleDraft': toggleDraft(id); break;
    case 'backFromReview': setState({ addPhase: state.addMode === 'auto' ? 'detect' : 'details' }); break;
    case 'confirmSave': confirmSave(); break;
    case 'doneBack': doneBack(); break;
    case 'doneAgain': doneAgain(); break;
  }
}

// ---------- computed view model (mirrors the original mockup's renderVals()) ----------
function computeVals() {
  const s = state;
  const gurusRaw = getGurus();
  const claimsRaw = getClaims();
  const draftRaw = getDraftClaims();

  const sorted = gurusRaw.slice().sort((a, b) => b.score - a.score);
  const query = s.searchQuery.trim().toLowerCase();
  const totalClaims = gurusRaw.reduce((sum, g) => sum + g.claims, 0);

  const gurus = sorted.map((g) => {
    const followed = !!s.followed[g.id];
    return {
      ...g,
      scoreColor: scoreColor(g.score),
      scoreBarWidth: g.score + '%',
      sourceLabel: g.primarySource === 'video' ? 'VIDEO' : 'BLOG',
      claimsSummary: g.claims + ' claims · ' + g.resolved + ' resolved · ' + g.open + ' open',
      followed,
      followLabel: followed ? 'Following' : 'Follow',
      starFill: followed ? 'currentColor' : 'none',
      followBtnStyle: followed
        ? 'display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:600;flex-shrink:0;'
        : 'display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;border:1px solid var(--border);background:none;color:var(--text-faint);font-size:11px;font-weight:600;flex-shrink:0;',
    };
  });

  const matchesQuery = (g) => query === '' || g.name.toLowerCase().indexOf(query) !== -1;
  const browseGurus = gurus.filter(matchesQuery);
  const watchlistFollowed = gurus.filter((g) => g.followed);
  const watchlistGurus = watchlistFollowed.filter(matchesQuery);

  const selectedGuru = gurusRaw.find((g) => g.id === s.selectedGuruId) || gurusRaw[0];
  let profileClaims = claimsRaw.filter((c) => c.guruId === selectedGuru.id);
  if (s.claimFilter === 'open') profileClaims = profileClaims.filter((c) => c.status === 'open');
  if (s.claimFilter === 'resolved') profileClaims = profileClaims.filter((c) => c.status === 'resolved');

  const sparkColors = { good: '#4fbf7a', mid: '#e3a63a', bad: '#e0616b' };
  const sparkColor = selectedGuru.score >= 70 ? sparkColors.good : selectedGuru.score >= 50 ? sparkColors.mid : sparkColors.bad;
  const sparkPointsByGuru = {
    'macro-chartist': '0,20 20,17 40,19 60,12 80,14 100,7 120,5',
    'crypto-compass': '0,10 20,14 40,11 60,20 80,22 100,18 120,21',
    'value-vane': '0,22 20,18 40,15 60,14 80,10 100,8 120,4',
    'oilpatch-ollie': '0,8 20,12 40,16 60,15 80,22 100,25 120,27',
    'swing-sensei': '0,18 20,15 40,18 60,13 80,15 100,9 120,11',
  };

  const profile = {
    ...selectedGuru,
    scoreColor: scoreColor(selectedGuru.score),
    sourceLabel: selectedGuru.primarySource === 'video' ? 'Video-focused' : 'Blog-focused',
    claimsSummary: selectedGuru.claims + ' claims · ' + selectedGuru.resolved + ' resolved · ' + selectedGuru.open + ' open',
    categories: selectedGuru.categories.map((c) => ({ ...c, barWidth: c.pct + '%' })),
    sparkPoints: sparkPointsByGuru[selectedGuru.id] || sparkPointsByGuru['macro-chartist'],
    sparkColor,
    sparkDelta: selectedGuru.score >= 70 ? '+4 vs. prior period' : selectedGuru.score >= 50 ? '−1 vs. prior period' : '−7 vs. prior period',
    emptyFilter: profileClaims.length === 0,
    claims: profileClaims.map((c) => {
      const hz = horizonStyle(c.horizon);
      const st = statusStyle(c);
      return { ...c, horizonLabel: hz.label, horizonBg: hz.bg, horizonColor: hz.color, statusLabel: st.label, statusColor: st.color, sourceTypeLabel: c.sourceType === 'video' ? 'VIDEO' : 'BLOG' };
    }),
  };

  const selectedClaim = claimsRaw.find((c) => c.id === s.selectedClaimId) || claimsRaw[0];
  const hz = horizonStyle(selectedClaim.horizon);
  const st = statusStyle(selectedClaim);
  const hasBenchmarks = !!selectedClaim.benchmarks;
  const claimDetail = {
    ...selectedClaim,
    horizonLabel: hz.label, horizonBg: hz.bg, horizonColor: hz.color,
    statusLabel: st.label, statusColor: st.color, statusBg: st.bg,
    sourceDisplay: '"' + selectedClaim.sourceTitle + '" — ' + (selectedClaim.sourceType === 'video' ? 'video' : 'blog post'),
    showRationale: selectedClaim.status === 'resolved',
    showOpenNote: selectedClaim.status === 'open',
    openNote: selectedClaim.windowText.indexOf('Open-ended') === 0 || selectedClaim.windowText.indexOf('no fixed') !== -1 || selectedClaim.windowText.indexOf('Trigger not yet met') !== -1 || selectedClaim.windowText.indexOf('Event-based') === 0
      ? 'No fixed target date — claim analyzer rechecks this periodically rather than resolving it once.'
      : 'Target window has not arrived yet — claim analyzer will resolve this once it does.',
    showBenchmark: hasBenchmarks,
    tradeReturnColor: hasBenchmarks && selectedClaim.tradeReturnValue >= 0 ? 'var(--good)' : 'var(--bad)',
    benchmarkRows: hasBenchmarks
      ? selectedClaim.benchmarks.map((b) => {
          const beat = selectedClaim.tradeReturnValue > b.value;
          return { ...b, beatLabel: beat ? 'Beat' : 'Lagged', beatColor: beat ? 'var(--good)' : 'var(--bad)' };
        })
      : [],
  };

  const addTargetNew = s.addTarget === 'new';
  const addTargetExisting = s.addTarget === 'existing';
  const addGuruContext = gurusRaw.find((g) => g.id === s.addGuruId);
  const detectedExpert = gurus.find((g) => g.id === s.addGuruId) || null;

  const autoOrder = ['link', 'detect', 'processing', 'review', 'done'];
  const directOrder = ['details', 'processing', 'review', 'done'];
  const phaseOrder = s.addMode === 'auto' ? autoOrder : directOrder;
  const phaseIndex = phaseOrder.indexOf(s.addPhase) + 1;
  const totalSteps = phaseOrder.length;

  const detailsContinueDisabled = !s.addUrl;
  const detectContinueDisabled = addTargetNew && s.addName.trim().length === 0;

  const draftClaims = draftRaw.map((d) => {
    const hzd = horizonStyle(d.horizon);
    const checked = s.addSelected[d.id] !== false;
    return { ...d, horizonLabel: hzd.label, horizonBg: hzd.bg, horizonColor: hzd.color, checked };
  });
  const selectedDraftCount = draftClaims.filter((d) => d.checked).length;

  return {
    statLine: gurusRaw.length + ' experts · ' + totalClaims + ' claims tracked',
    gurus, browseGurus, watchlistGurus,
    browseNoMatches: browseGurus.length === 0,
    watchlistEmpty: watchlistFollowed.length === 0,
    watchlistNoMatches: watchlistFollowed.length > 0 && watchlistGurus.length === 0,
    backToListLabel: s.listScreen === 'browse' ? 'Browse all experts' : 'Watchlist',
    profile,
    claimDetail,
    addModeAuto: s.addMode === 'auto',
    addStepNum: String(phaseIndex),
    addTotalSteps: String(totalSteps),
    addDot: [1, 2, 3, 4, 5].map((n) => (phaseIndex >= n ? 'var(--accent)' : 'var(--border)')),
    flowLabel: s.addMode === 'auto' ? 'Add a link' : 'Add a video or post',
    addTargetNew, addTargetExisting, addGuruContext, detectedExpert,
    detectTitle: addTargetExisting ? 'We recognized this source' : 'New expert details',
    detectSourceTypeLabel: s.addSourceType === 'video' ? 'Video' : 'Blog',
    detailsTitle: 'Add to ' + (addGuruContext ? addGuruContext.name : ''),
    urlLabel: s.addSourceType === 'video' ? 'YouTube video URL' : 'Blog post URL',
    urlPlaceholder: s.addSourceType === 'video' ? 'https://youtube.com/watch?v=...' : 'https://example.com/blog/post',
    detailsContinueDisabled, detectContinueDisabled,
    linkContinueDisabled: !s.addUrl,
    showProcessingIntro: s.addMode === 'auto',
    processingIntro: addTargetExisting
      ? 'Matched to ' + (addGuruContext ? addGuruContext.name : '')
      : 'Registered ' + (s.addName || 'this expert') + ' as new',
    draftClaims, selectedDraftCount,
    confirmLabel: 'Save ' + selectedDraftCount + (selectedDraftCount === 1 ? ' claim' : ' claims'),
    doneBackLabel: addTargetExisting ? 'Back to profile' : 'Back to Watchlist',
    doneAgainLabel: addTargetExisting ? 'Add another video/post' : 'Add another link',
  };
}

        <div style="font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px;">Rationale</div>
        <div style="font-size:13.5px;color:var(--text);line-height:1.6;">${cd.rationale}</div>` : ''}
        ${cd.showOpenNote ? `<div style="font-size:13px;color:var(--text-muted);line-height:1.55;">${cd.openNote}</div>` : ''}
        ${cd.showBenchmark ? `
        <div style="margin-top:22px;padding-top:18px;border-top:1px solid var(--border);">
          <div style="font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:12px;">Benchmark comparison</div>
          <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;">
            <span style="font-size:13px;color:var(--text-muted);">This trade</span>
            <span class="gl-mono" style="font-size:16px;font-weight:600;color:${cd.tradeReturnColor};">${cd.tradeReturnLabel}</span>
          </div>
          ${cd.benchmarkRows.map((b) => `
          <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--border);">
            <span style="font-size:12.5px;color:var(--text-muted);">${b.label} <span class="gl-mono" style="color:var(--text-faint);">${b.ticker}</span></span>
            <div style="display:flex;align-items:center;gap:8px;">
              <span class="gl-mono" style="font-size:12.5px;color:var(--text-muted);">${b.display}</span>
              <span class="gl-mono" style="font-size:10px;font-weight:600;letter-spacing:0.03em;padding:2px 7px;border-radius:999px;color:${b.beatColor};">${b.beatLabel}</span>
            </div>
          </div>`).join('')}
        </div>` : ''}
      </div>
    </div>
  </div>`;
}

function checklistItem(text) {
  return `
  <div style="display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--border);border-radius:8px;background:var(--card);">
    <div style="width:20px;height:20px;border-radius:50%;background:var(--good-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
      <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="var(--good)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"></path></svg>
    </div>
    <div style="font-size:13.5px;">${text}</div>
  </div>`;
}

function renderAdd(vals) {
  const dots = vals.addDot.map((c) => `<div style="height:3px;flex:1;border-radius:2px;background:${c};"></div>`);
  const dotsHtml = vals.addModeAuto ? dots.join('') : dots.slice(0, 4).join('');
  const enabledBtn = 'background:var(--accent);color:#1a1305;border:none;border-radius:7px;padding:11px 18px;font-size:13px;font-weight:600;';
  const disabledBtn = enabledBtn + 'opacity:0.4;';

  let phaseHtml = '';
  if (state.addPhase === 'link') {
    phaseHtml = `
      <div style="font-size:20px;font-weight:600;margin-bottom:8px;">Add a link</div>
      <div style="font-size:13px;color:var(--text-muted);margin-bottom:24px;line-height:1.5;">Paste a YouTube video or blog post link — we'll check whether it's from an expert you already track.</div>
      <label style="font-size:12px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.06em;">Video or blog link</label>
      <input id="add-url-input" type="text" value="${escapeAttr(state.addUrl)}" data-bind="addUrl" placeholder="https://youtube.com/watch?v=... or https://example.com/post" style="width:100%;margin:8px 0 24px;padding:11px 13px;border-radius:7px;border:1px solid var(--border);background:var(--bg2);color:var(--text);font-size:13.5px;" />
      <div style="display:flex;gap:10px;">
        <button data-act="backFromLink" style="padding:11px 18px;border-radius:7px;border:1px solid var(--border);background:none;color:var(--text-muted);font-size:13px;">Back</button>
        <button data-act="runDetection" ${vals.linkContinueDisabled ? 'disabled' : ''} style="${vals.linkContinueDisabled ? disabledBtn : enabledBtn}">Continue</button>
      </div>`;
  } else if (state.addPhase === 'detect') {
    phaseHtml = `
      <div style="font-size:20px;font-weight:600;margin-bottom:8px;">${vals.detectTitle}</div>
      <div class="gl-mono" style="font-size:11px;color:var(--text-faint);margin-bottom:20px;">Detected: ${vals.detectSourceTypeLabel} source</div>
      ${vals.addTargetExisting ? `
      <div style="display:flex;align-items:center;gap:14px;padding:16px;border:1px solid var(--accent);border-radius:10px;background:var(--accent-soft);margin-bottom:16px;">
        <div class="gl-mono" style="width:40px;height:40px;border-radius:50%;background:var(--bg2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;color:var(--accent);flex-shrink:0;">${vals.detectedExpert.initials}</div>
        <div>
          <div style="font-weight:600;font-size:14.5px;">${vals.detectedExpert.name}</div>
          <div style="font-size:12.5px;color:var(--text-muted);margin-top:2px;">Recognized — we'll add this to their existing claim history</div>
        </div>
      </div>
      <button data-act="useDifferentExpert" style="background:none;border:none;color:var(--text-muted);font-size:12.5px;padding:0;margin-bottom:24px;text-decoration:underline;text-align:left;">Not them? Register as a new expert instead</button>` : ''}
      ${vals.addTargetNew ? `
      <div style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">We don't recognize this source yet.</div>
      <label style="font-size:12px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.06em;">Expert name</label>
      <input id="add-name-input" type="text" value="${escapeAttr(state.addName)}" data-bind="addName" placeholder="e.g. MacroChartist" style="width:100%;margin:8px 0 24px;padding:11px 13px;border-radius:7px;border:1px solid var(--border);background:var(--bg2);color:var(--text);font-size:13.5px;" />` : ''}
      <div style="display:flex;gap:10px;">
        <button data-act="backToLink" style="padding:11px 18px;border-radius:7px;border:1px solid var(--border);background:none;color:var(--text-muted);font-size:13px;">Back</button>
        <button data-act="continueFromDetect" ${vals.detectContinueDisabled ? 'disabled' : ''} style="${vals.detectContinueDisabled ? disabledBtn : enabledBtn}">Continue</button>
      </div>`;
  } else if (state.addPhase === 'details') {
    phaseHtml = `
      <div style="font-size:20px;font-weight:600;margin-bottom:20px;">${vals.detailsTitle}</div>
      <label style="font-size:12px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.06em;display:block;margin-bottom:8px;">Source type</label>
      <div style="display:flex;gap:8px;margin-bottom:18px;">
        <button data-act="setSourceVideo" style="${activeChip(state.addSourceType === 'video')}display:flex;align-items:center;gap:7px;">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="14" height="12" rx="2"></rect><path d="M16 10l6-3v10l-6-3"></path></svg>
          Video
        </button>
        <button data-act="setSourceBlog" style="${activeChip(state.addSourceType === 'blog')}display:flex;align-items:center;gap:7px;">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l3 3v15H6z"></path><path d="M9 9h6M9 13h6M9 17h4"></path></svg>
          Blog
        </button>
      </div>
      <label style="font-size:12px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.06em;">${vals.urlLabel}</label>
      <input id="add-url-input" type="text" value="${escapeAttr(state.addUrl)}" data-bind="addUrl" placeholder="${vals.urlPlaceholder}" style="width:100%;margin:8px 0 24px;padding:11px 13px;border-radius:7px;border:1px solid var(--border);background:var(--bg2);color:var(--text);font-size:13.5px;" />
      <div style="display:flex;gap:10px;">
        <button data-act="backFromDetails" style="padding:11px 18px;border-radius:7px;border:1px solid var(--border);background:none;color:var(--text-muted);font-size:13px;">Back</button>
        <button data-act="continueToProcessing" ${vals.detailsContinueDisabled ? 'disabled' : ''} style="${vals.detailsContinueDisabled ? disabledBtn : enabledBtn}">Continue</button>
      </div>`;
  } else if (state.addPhase === 'processing') {
    phaseHtml = `
      <div style="font-size:20px;font-weight:600;margin-bottom:20px;">Running claim finder</div>
      <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:26px;">
        ${vals.showProcessingIntro ? checklistItem(vals.processingIntro) : ''}
        ${checklistItem('Fetched source content')}
        ${checklistItem('Extracted claims — no categorization, no collapsing')}
        ${checklistItem('Ready for review')}
      </div>
      <button data-act="continueToReview" style="display:flex;align-items:center;gap:8px;background:var(--accent);color:#1a1305;border:none;border-radius:7px;padding:11px 18px;font-size:13px;font-weight:600;">
        Review claims
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
      </button>`;
  } else if (state.addPhase === 'review') {
    phaseHtml = `
      <div style="font-size:20px;font-weight:600;margin-bottom:6px;">Review extracted claims</div>
      <div style="font-size:13px;color:var(--text-muted);margin-bottom:20px;">Uncheck anything you don't want kept in the ledger.</div>
      <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:24px;">
        ${vals.draftClaims.map((d) => `
        <div data-act="toggleDraft" data-id="${d.id}" style="display:flex;align-items:flex-start;gap:14px;padding:16px;border:1px solid var(--border);border-radius:8px;background:var(--card);cursor:pointer;">
          <div style="${d.checked ? 'width:20px;height:20px;border-radius:5px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;' : 'width:20px;height:20px;border-radius:5px;border:1.5px solid var(--border);flex-shrink:0;margin-top:2px;'}">
            ${d.checked ? `<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="#151a1f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"></path></svg>` : ''}
          </div>
          <div style="flex:1;min-width:0;">
            <div style="display:flex;align-items:baseline;gap:8px;">
              <div style="font-weight:600;font-size:14px;">${d.asset}</div>
              <span class="gl-mono" style="font-size:10.5px;padding:3px 8px;border-radius:999px;background:${d.horizonBg};color:${d.horizonColor};">${d.horizonLabel}</span>
            </div>
            <div style="font-size:13px;color:var(--text-muted);margin-top:4px;">${d.outcome}</div>
            <div style="font-size:11.5px;color:var(--text-faint);margin-top:6px;font-style:italic;">${d.condition}</div>
          </div>
        </div>`).join('')}
      </div>
      <div style="display:flex;gap:10px;">
        <button data-act="backFromReview" style="padding:11px 18px;border-radius:7px;border:1px solid var(--border);background:none;color:var(--text-muted);font-size:13px;">Back</button>
        <button data-act="confirmSave" style="background:var(--accent);color:#1a1305;border:none;border-radius:7px;padding:11px 18px;font-size:13px;font-weight:600;">${vals.confirmLabel}</button>
      </div>`;
  } else if (state.addPhase === 'done') {
    phaseHtml = `
      <div style="padding:36px 8px;text-align:center;">
        <div style="width:44px;height:44px;border-radius:50%;background:var(--good-soft);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="var(--good)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"></path></svg>
        </div>
        <div style="font-size:19px;font-weight:600;margin-bottom:8px;">${state.addSavedCount} claims added</div>
        <div style="font-size:13.5px;color:var(--text-muted);margin-bottom:26px;">Claim analyzer will start checking these against their target windows automatically.</div>
        <div style="display:flex;gap:10px;justify-content:center;">
          <button data-act="doneBack" style="padding:11px 18px;border-radius:7px;border:1px solid var(--border);background:none;color:var(--text);font-size:13px;">${vals.doneBackLabel}</button>
          <button data-act="doneAgain" style="background:var(--accent);color:#1a1305;border:none;border-radius:7px;padding:11px 18px;font-size:13px;font-weight:600;">${vals.doneAgainLabel}</button>
        </div>
      </div>`;
  }

  return `
  <div style="padding:40px 48px 64px;max-width:640px;">
    <div class="gl-mono" style="font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px;">${vals.flowLabel} · Step ${vals.addStepNum} of ${vals.addTotalSteps}</div>
    <div style="display:flex;gap:5px;margin-bottom:32px;">${dotsHtml}</div>
    ${phaseHtml}
  </div>`;
}

// ---------- render loop ----------
function render() {
  const active = document.activeElement;
  const activeId = active && active.id;
  const selStart = activeId && typeof active.selectionStart === 'number' ? active.selectionStart : null;
  const selEnd = activeId && typeof active.selectionEnd === 'number' ? active.selectionEnd : null;

  const vals = computeVals();
  let screenHtml = '';
  if (state.screen === 'watchlist') screenHtml = renderWatchlist(vals);
  else if (state.screen === 'browse') screenHtml = renderBrowse(vals);
  else if (state.screen === 'profile') screenHtml = renderProfile(vals);
  else if (state.screen === 'claim') screenHtml = renderClaim(vals);
  else if (state.screen === 'add') screenHtml = renderAdd(vals);

  const app = document.getElementById('app');
  app.innerHTML = sidebarHtml(vals) + `<div style="flex:1;min-width:0;overflow-y:auto;height:100vh;">${screenHtml}</div>`;

  if (activeId) {
    const el = document.getElementById(activeId);
    if (el) {
      el.focus();
      if (selStart !== null && el.setSelectionRange) {
        try { el.setSelectionRange(selStart, selEnd); } catch (e) {}
      }
    }
  }
}

document.addEventListener('click', function (e) {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  handleAction(el.dataset.act, el.dataset.id);
});
document.addEventListener('input', function (e) {
  const el = e.target;
  if (el && el.dataset && el.dataset.bind) {
    state[el.dataset.bind] = el.value;
    render();
  }
});

render();
</script>
</body>
</html>
