<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>AnalystAudit — Add a link</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    :root {
      --bg: #101418; --bg2: #171c22; --card: #1b2129; --card-hover: #212832;
      --border: #2a323d; --text: #e7ebf0; --text-muted: #8b96a3; --text-faint: #5b6572;
      --accent: #e3a63a; --accent-soft: rgba(227,166,58,0.14);
      --good: #4fbf7a; --good-soft: rgba(79,191,122,0.14);
      --bad: #e0616b; --bad-soft: rgba(224,97,107,0.14);
      --pending: #8b96a3; --pending-soft: rgba(139,150,163,0.12);
    }
    .gl-root, .gl-root button, .gl-root input { font-family: 'Space Grotesk', system-ui, sans-serif; }
    .gl-mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
    .gl-root a { color: var(--accent); text-decoration: none; }
    .gl-root button { cursor: pointer; }
</style>
</head>
<body>
<div data-dc-tpl="3" class="gl-root" style="display: flex; width: 100%; min-height: 100vh; background: var(--bg); color: var(--text);">

  
  <div data-dc-tpl="4" style="width: 232px; flex-shrink: 0; display: flex; flex-direction: column; background: var(--bg2); border-right: 1px solid var(--border); padding: 22px 16px;">
    <div data-dc-tpl="5" style="padding: 0px 8px 24px;">
      <div data-dc-tpl="6" class="gl-mono" style="font-weight: 600; font-size: 15px; letter-spacing: 0.02em;">ANALYST<span data-dc-tpl="7" style="color: var(--accent);">·</span>AUDIT</div>
      <div data-dc-tpl="8" style="font-size: 11px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 4px;">track record engine</div>
    </div>

    <div data-dc-tpl="9" style="display: flex; flex-direction: column; gap: 2px;">
      <button data-dc-tpl="10" class="gl-navitem" style="display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 7px; background: none; border-width: medium; border-style: none; border-color: currentcolor; border-image: none; color: var(--text-muted); font-size: 13.5px; text-align: left;">
        <svg data-dc-tpl="11" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path data-dc-tpl="12" d="M6 3h12v18l-6-4-6 4z"></path></svg>
        <span data-dc-tpl="13">Watchlist</span>
      </button>
      <button data-dc-tpl="14" class="gl-navitem" style="display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 7px; background: none; border-width: medium; border-style: none; border-color: currentcolor; border-image: none; color: var(--text-muted); font-size: 13.5px; text-align: left;">
        <svg data-dc-tpl="15" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect data-dc-tpl="16" x="3" y="3" width="7" height="9" rx="1"></rect><rect data-dc-tpl="17" x="14" y="3" width="7" height="5" rx="1"></rect><rect data-dc-tpl="18" x="14" y="12" width="7" height="9" rx="1"></rect><rect data-dc-tpl="19" x="3" y="16" width="7" height="5" rx="1"></rect></svg>
        <span data-dc-tpl="20">Browse all</span>
      </button>
      <button data-dc-tpl="21" class="gl-navitem" style="display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 7px; background: var(--card); border-width: medium; border-style: none; border-color: currentcolor; border-image: none; color: var(--text); font-size: 13.5px; text-align: left;">
        <svg data-dc-tpl="22" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path data-dc-tpl="23" d="M12 5v14M5 12h14"></path></svg>
        <span data-dc-tpl="24">Add a link</span>
      </button>
    </div>

    <div data-dc-tpl="25" style="flex: 1 1 0%;"></div>

    <div data-dc-tpl="26" style="padding: 12px 8px; border-top: 1px solid var(--border);">
      <div data-dc-tpl="27" class="gl-mono" style="font-size: 12px; color: var(--text-muted);"><span class="sc-interp">5 experts · 183 claims tracked</span></div>
      <div data-dc-tpl="28" style="font-size: 11px; color: var(--text-faint); margin-top: 4px;">Single-user · MVP</div>
    </div>
  </div>

  
  <div data-dc-tpl="29" style="flex: 1 1 0%; min-width: 0px; overflow-y: auto; height: 100vh;">

    
    

    
    

    
    

    
    

    
    
      <div data-dc-tpl="216" style="padding: 40px 48px 64px; max-width: 640px;">
        <div data-dc-tpl="217" class="gl-mono" style="font-size: 11px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px;"><span class="sc-interp">Add a link</span> · Step <span class="sc-interp">1</span> of <span class="sc-interp">5</span></div>
        <div data-dc-tpl="218" style="display: flex; gap: 5px; margin-bottom: 32px;">
          <div data-dc-tpl="219" style="height: 3px; flex: 1 1 0%; border-radius: 2px; background: var(--accent);"></div>
          <div data-dc-tpl="220" style="height: 3px; flex: 1 1 0%; border-radius: 2px; background: var(--border);"></div>
          <div data-dc-tpl="221" style="height: 3px; flex: 1 1 0%; border-radius: 2px; background: var(--border);"></div>
          <div data-dc-tpl="222" style="height: 3px; flex: 1 1 0%; border-radius: 2px; background: var(--border);"></div>
          
            <div data-dc-tpl="224" style="height: 3px; flex: 1 1 0%; border-radius: 2px; background: var(--border);"></div>
          
        </div>

        
        
          <div data-dc-tpl="226" style="font-size: 20px; font-weight: 600; margin-bottom: 8px;">Add a link</div>
          <div data-dc-tpl="227" style="font-size: 13px; color: var(--text-muted); margin-bottom: 24px; line-height: 1.5;">Paste a YouTube video or blog post link — we'll check whether it's from an expert you already track.</div>

          <label data-dc-tpl="228" style="font-size: 12px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.06em;">Video or blog link</label>
          <input data-dc-tpl="229" type="text" placeholder="https://youtube.com/watch?v=... or https://example.com/post" value="" style="width: 100%; margin: 8px 0px 24px; padding: 11px 13px; border-radius: 7px; border: 1px solid var(--border); background: var(--bg2); color: var(--text); font-size: 13.5px;">

          <div data-dc-tpl="230" style="display: flex; gap: 10px;">
            <button data-dc-tpl="231" style="padding: 11px 18px; border-radius: 7px; border: 1px solid var(--border); background: none; color: var(--text-muted); font-size: 13px;">Back</button>
            <button data-dc-tpl="232" disabled="" style="background: var(--accent); color: rgb(26, 19, 5); border-width: medium; border-style: none; border-color: currentcolor; border-image: none; border-radius: 7px; padding: 11px 18px; font-size: 13px; font-weight: 600; opacity: 0.4;">Continue</button>
          </div>
        

        
        

        
        

        
        

        
        

        
        
      </div>
    

  </div></div>
</body>
</html>
